openapi: 3.0.1
info:
  title: darius-backend
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: fee
- name: bot
- name: general
- name: api
- name: account
- name: plan
- name: subscription
paths:
  /health_liveness:
    get:
      tags:
      - general
      summary: Return a 200 status if health check is successful
      operationId: main.src.controllers.v1.general.get_health_liveness
      responses:
        200:
          description: Liveness Health check is successful
          content:
            application/json:
              schema: 
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        default:
          $ref: '#/components/responses/Unexpected'
          
  /health_readiness:
    get:
      tags:
      - general
      summary: Return a 200 status if health check is successful
      operationId: main.src.controllers.v1.general.get_health_readiness
      responses:
        200:
          description: Readiness Health check is successful
          content:
            application/json:
              schema: 
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        default:
          $ref: '#/components/responses/Unexpected'

  /create_test_data:
    get:
      tags:
      - general
      summary: create test data in database
      operationId: main.src.controllers.v1.general.create_test_data
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /update_user_profile:
    patch:
      tags:
      - account
      summary: update user profile
      operationId: main.src.controllers.v1.account.update_user_profile
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: number
                user_name:
                  type: string
                email: 
                  type: string
              required:
                - user_id
                - user_name
                - email
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'   
  
  /execute_bot_signal:
    post:
      tags:
      - bot
      summary: recieve signal info and make orders
      operationId: main.src.controllers.v1.bot.execute_bot_signal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                content:
                  type: string
                  nullable: true
                message_timestamp:
                  type: number
                recieve_timestamp:
                  type: number
                symbol:
                  type: string
                  nullable: true
                  maxLength: 16
                action:
                  $ref: '#/components/schemas/Action'
              required:
              - channel
              - content
              - message_timestamp
              - recieve_timestamp
              - symbol
              - action
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /get_user_bots:
    get:
      tags:
      - bot
      summary: get user running bot
      operationId: main.src.controllers.v1.bot.get_user_bots
      parameters:
        - in: query
          name: user_id
          schema:
            type: integer
          description: user ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bot_id:
                      type: integer
                    config:
                      type: object
                    channel:
                      $ref: '#/components/schemas/Channel'
                    status:
                      $ref: '#/components/schemas/BotStatus'
                  required:
                  - channel
                  - status
                  - config
                  - bot_id
        default:
          $ref: '#/components/responses/Unexpected'

  /get_bot_trades:
    get:
      tags:
      - bot
      summary: get bot trade history
      operationId: main.src.controllers.v1.bot.get_bot_trades
      parameters:
        - in: query
          name: bot_id
          schema:
            type: integer
          description: bot ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    message:
                      $ref: '#/components/schemas/Message'
                    status:
                      $ref: '#/components/schemas/TradeStatus'
                    error:
                      type: string
                      nullable: True
                  required:
                  - message
                  - status
                  - error
        default:
          $ref: '#/components/responses/Unexpected'
          
  /create_user_bot:
    post:
      tags:
      - bot
      summary: create new bot. 5 for each user.
      operationId: main.src.controllers.v1.bot.create_user_bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                api_id:
                  type: integer
                config:
                  $ref: '#/components/schemas/BotConfig'
                channel:
                  type: string
              required:
              - user_id
              - api_id
              - config
              - channel
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'
          
  /delete_user_bot:
    delete:
      tags:
      - bot
      summary: delete bot
      operationId: main.src.controllers.v1.bot.delete_user_bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                bot_id:
                  type: integer
              required:
              - user_id
              - bot_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
  
  /create_user_api:
    post:
      tags:
      - api
      summary: create new api. 3 for each user.
      operationId: main.src.controllers.v1.api.create_user_api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/API'
                - type: object
                  properties:
                    user_id:
                      type: integer
                  required:
                  - user_id
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'

  /update_user_api:
    patch:
      tags:
      - api
      summary: update user api.
      operationId: main.src.controllers.v1.api.update_user_api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/API'
                - type: object
                  properties:
                    user_id:
                      type: integer
                    api_id:
                      type: integer
                  required:
                  - user_id
                  - api_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
          
  /get_user_api:
    get:
      tags:
      - api
      summary: get user api.
      operationId: main.src.controllers.v1.api.get_user_api
      parameters:
        - in: query
          name: user_id
          schema:
            type: integer
          description: user ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/API'
                    - type: object
                      properties:
                        api_id:
                          type: integer
                      required:
                      - api_id
        default:
          $ref: '#/components/responses/Unexpected'

  /delete_user_api:
    delete:
      tags:
      - api
      summary: delete api
      operationId: main.src.controllers.v1.api.delete_user_api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                api_id:
                  type: integer
              required:
              - user_id
              - api_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
          
  /create_plan:
    post:
      tags:
      - plan
      summary: create plan
      operationId: main.src.controllers.v1.plan.create_plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Plan'
                - type: object
                  properties:
                    user_id:
                      type: integer
                  required:
                  - user_id
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'
          
  /update_plan:
    patch:
      tags:
      - plan
      summary: update plan
      operationId: main.src.controllers.v1.plan.update_plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Plan'
                - type: object
                  properties:
                    user_id:
                      type: integer
                    plan_id:
                      type: integer
                  required:
                  - user_id
                  - plan_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
          
  /get_plan:
    get:
      tags:
      - plan
      summary: get plan
      operationId: main.src.controllers.v1.plan.get_plan
      parameters:
        - in: query
          name: plan_id
          schema:
            type: integer
          description: plan ID
        - in: query
          name: user_id
          schema:
            type: integer
          description: user ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Plan'
                - type: object
                  properties:
                    plan_id:
                      type: integer
                  required:
                  - plan_id
        default:
          $ref: '#/components/responses/Unexpected'

  /delete_plan:
    delete:
      tags:
      - plan
      summary: delete plan
      operationId: main.src.controllers.v1.plan.delete_plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: integer
                user_id:
                  type: integer
              required:
              - plan_id
              - user_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'

  /create_user_subscription:
    post:
      tags:
      - subscription
      summary: create new subscription.
      operationId: main.src.controllers.v1.subscription.create_user_subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                plan_id:
                  type: integer
              required:
              - user_id
              - plan_id
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'

  /update_user_subscription:
    patch:
      tags:
      - subscription
      summary: update user subscription.
      operationId: main.src.controllers.v1.subscription.update_user_subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Subscription'
                - type: object
                  properties:
                    user_id:
                      type: integer
                    subscription_id:
                      type: integer
                  required:
                  - user_id
                  - subscription_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
          
  /get_user_subscription:
    get:
      tags:
      - subscription
      summary: get user subscription.
      operationId: main.src.controllers.v1.subscription.get_user_subscription
      parameters:
        - in: query
          name: user_id
          schema:
            type: integer
          description: user ID
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Subscription'
                    - type: object
                      properties:
                        subscription_id:
                          type: integer
                        plan:
                          $ref: '#/components/schemas/Plan'
                      required:
                      - subscription_id
                      - plan
        default:
          $ref: '#/components/responses/Unexpected'

  /delete_user_subscription:
    delete:
      tags:
      - subscription
      summary: delete subscription
      operationId: main.src.controllers.v1.subscription.delete_user_subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                subscription_id:
                  type: integer
              required:
              - user_id
              - subscription_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
  
  /user_confirm_payment:
    post:
      tags:
      - fee
      summary: give payment confirmation results and new due date
      operationId: main.src.controllers.v1.fee.user_confirm_payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                # add
              required:
              - user_id
      responses:
        '200':
          description: give payment confirmation results
          content:
            application/json:
              schema: 
                type: object
                properties:
                  status:
                    type: string
                required:
                - status
        '400':
          description: The specified user ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
  
  /get_user_due_date:
    get:
      tags:
      - fee
      summary: get user due date
      operationId: main.src.controllers.v1.fee.get_user_due_date
      parameters:
        - in: query
          name: user_id
          schema:
            type: integer
          description: user ID
      responses:
        '200':
          description: Get user due date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: number
                required:
                - timestamp
        '400':
          description: The specified user ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Unexpected'
          
components:

  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unexpected:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
        code:
          type: integer
          minimum: 100
          maximum: 600

    ExtendedError:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        required:
        - rootCause
        properties:
          rootCause:
            type: string

    Action:
      type: string
      nullable: true
      maxLength: 16
      enum:
        - BUY
        - SELL
        - null

    BotStatus:
      type: string
      enum:
        - PENDING
        - RUNNING
        - SUSPEND
        - STOPPED

    Channel:
      type: string
      enum:
        - ROSE
        - PERPETUAL
        - WHALE
        - DAILYSCALP
        - test
        - test2
    
    Exchange:
      type: string
      enum:
        - binance
        - ftx

    TradeStatus:
      type: string
      enum:
        - open
        - closed
        - canceled
        - expired
        - error

    API:
      type: object
      properties:
        api_key:
          type: string
          maxLength: 50
        api_secret:
          type: string
          maxLength: 50
        exchange:
          type: string
          maxLength: 16
          enum: [binance, ftx]
      required:
      - api_key
      - api_secret
      - exchange

    BotConfig:
      type: object
      properties:
        api:
          $ref: '#/components/schemas/API'
        test:
          type: boolean
        duplicate:
          type: boolean
        target:
          type: string
          enum: [SPOT, MARGIN, FUTURE]
        quantity:
          type: number
          minimum: 100
        leverage:
          type: number
          minimum: 0
          maximum: 1
        margin:
          type: number
          minimum: 0
          maximum: 1000
        minimum_volume:
          type: number
          minimum: 0
        stop_loss:
          type: number
          minimum: 0
          maximum: 1
        take_profit:
          type: number
          minimum: 0
          maximum: 1
        order_type:
          type: string
          enum: [MARKET, LIMIT]
        stop_loss_type:
          type: string
          enum: [MARKET, LIMIT]
        take_profit_type:
          type: string
          enum: [MARKET, LIMIT]

    Message:
      type: object
      properties:
        channel:
          type: string
          maxLength: 32
        content:
          type: string
          nullable: true
          maxLength: 1024
        message_timestamp:
          oneOf:
            - type: string
            - type: number
          minimum: 0
        recieve_timestamp:
          oneOf:
            - type: string
            - type: number
          minimum: 100
        symbol:
          type: string
          nullable: true
          maxLength: 16
        action:
          $ref: '#/components/schemas/Action'
      required:
      - channel
      - content
      - message_timestamp
      - recieve_timestamp
      - symbol
      - action
      
      
    Plan:
      type: object
      properties:
        name:
          type: string
          maxLength: 32
        channel:
          type: string
          maxLength: 32
        price:
          type: number
          minimum: 0
        day:
          type: integer
          minimum: 0
      required:
      - name
      - channel
      - price
      - day
      
    Subscription:
      type: object
      properties:
        expire_date:
          type: string
          maxLength: 32
        status:
          type: string
          maxLength: 16
      required:
      - expire_date
      - status
