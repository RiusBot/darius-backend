components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: main.src.core.auth.openapi_auth
      
    bearerAuthBackendOnly:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: main.src.core.auth.openapi_auth_backend_only

  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unexpected:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
        code:
          type: integer
          minimum: 100
          maximum: 600

    ExtendedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
          - rootCause
          properties:
            rootCause:
              type: string

    Action:
      type: string
      nullable: true
      maxLength: 16
      enum:
        - BUY
        - SELL
        - null

    BotStatus:
      type: string
      enum:
        - PENDING
        - RUNNING
        - SUSPEND
        - STOPPED

    Channel:
      type: string
      maxLength: 16
      enum:
        - ROSE
        - PERPETUAL
        - WHALE
        - DAILYSCALP
        - VEGAS
        - JUSTIN
        - WEBHOOK
        - COURAGE
        - MOON
        - ARBITRAGE
    
    Exchange:
      type: string
      maxLength: 16
      enum:
        - binance
        - ftx
        - ftxus

    TradeStatus:
      type: string
      enum:
        - open
        - closed
        - canceled
        - expired
        - error
        - success
        - SL
        - TP

    User:
      type: object
      properties:
        uid:
          type: string
          maxLength: 28
          minLength: 28
        user_name:
          type: string
          maxLength: 16
          nullable: True
        email: 
          type: string
          maxLength: 32
          nullable: True
        balance:
          type: number
          minimum: 0
        referrer:
          type: string
          maxLength: 8
          minLength: 8
          nullable: True
        referral_code:
          type: string
          maxLength: 8
          minLength: 8
        referrer_count:
          type: integer
          minimum: 0
      required:
        - uid
        - user_name
        - email
        - balance
        - referrer
        - referral_code
    
    API_READ:
      type: object
      properties:
        api_id:
          type: integer
        api_key:
          type: string
          maxLength: 64
        api_secret:
          type: string
          maxLength: 64
        exchange:
          $ref: '#/components/schemas/Exchange'
        subaccount:
          type: string
          maxLength: 32
          nullable: True
      required:
      - api_key
      - exchange
      
    API_WRITE:
      type: object
      properties:
        api_key:
          type: string
          maxLength: 64
        api_secret:
          type: string
          maxLength: 64
        exchange:
          $ref: '#/components/schemas/Exchange'
        subaccount:
          type: string
          maxLength: 32
          nullable: True
      required:
      - api_key
      - exchange
      - api_secret

    Hyperopt:
      type: object
      properties:
        take_profit:
          type: number
        stop_loss:
          type: number
    
    BotConfig:
      type: object
      properties:
        api_id:
          type: integer
        test:
          type: boolean
        hyperopt:
          type: boolean
          nullable: true
        duplicate:
          type: boolean
        target:
          type: string
          enum: [SPOT, MARGIN, FUTURE]
        quantity:
          type: number
          minimum: 30
        leverage:
          type: number
          minimum: 0
        margin:
          type: number
          minimum: 0
          maximum: 1000
          nullable: true
        minimum_volume:
          type: number
          minimum: 0
          nullable: true
        stop_loss:
          type: number
          minimum: -1
          maximum: 1
          nullable: true
        take_profit:
          type: number
          minimum: -1
          maximum: 5
          nullable: true
        order_type:
          type: string
          enum: [MARKET, LIMIT]
        stop_loss_type:
          type: string
          enum: [MARKET, LIMIT, TRAILING]
        take_profit_type:
          type: string
          enum: [MARKET, LIMIT, TRAILING]
      required:
        - api_id
        - test
        - duplicate
        - target
        - quantity
        - leverage
        - order_type
        - stop_loss_type
        - take_profit_type

    Message:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/Channel'
        content:
          type: string
          nullable: true
          maxLength: 1024
        message_timestamp:
          type: number
          minimum: 0
        recieve_timestamp:
          type: number
          minimum: 0
        symbol:
          type: string
          nullable: true
          maxLength: 16
        action:
          $ref: '#/components/schemas/Action'
        price:
          type: number
          nullable: True
        entry:
          type: number
          nullable: True
        stop_loss:
          type: number
          nullable: True
        take_profit:
          type: number
          nullable: True
      required:
      - channel
      - content
      - message_timestamp
      - recieve_timestamp
      - symbol
      - action

    Performance:
      type: object
      properties:
        date:
          type: string
          maxLength: 10
          example:
            value: "2022-01-01"
        result:
          type: object
        channel:
          $ref: '#/components/schemas/Channel'
    
    Transaction:
      type: object
      properties:
        wallet:
          type: string
          maxLength: 96
        txid:
          type: string
          maxLength: 96
        date:
          type: string
          maxLength: 10
          example:
            value: "2022-01-01"
        amount:
          type: number
          minimum: 0
      required:
        - wallet
        - txid
        - date

    Plan:
      type: object
      properties:
        name:
          type: string
          maxLength: 32
        channel:
          $ref: '#/components/schemas/Channel'
        price:
          type: number
          minimum: 0
        day:
          type: integer
          minimum: 0
      required:
      - name
      - channel
      - price
      - day
    
    Subscription:
      type: object
      properties:
        expire_date:
          type: string
          nullable: true
        invite_link:
          type: string
          nullable: true

    Trade:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
        status:
          $ref: '#/components/schemas/TradeStatus'
        error:
          type: string
          nullable: True
        open_order:
          type: string
          nullable: True
        sl_order:
          type: string
          nullable: True
        tp_order:
          type: string
          nullable: True
      required:
      - message
      - status
