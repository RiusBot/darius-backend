openapi: 3.0.1
info:
  title: darius-backend
  version: 1.0.0
servers:
- url: /api/v1
tags:
- name: fee
- name: bot
- name: general
- name: api
- name: account
- name: plan
- name: performance
- name: hyperopt
- name: subscription
- name: transaction
- name: telegram
- name: trade
security:
  - bearerAuth: []
paths:
  /health_liveness:
    get:
      tags:
      - general
      summary: Return a 200 status if health check is successful
      operationId: main.src.controllers.v1.general.get_health_liveness
      security: []
      responses:
        200:
          description: Liveness Health check is successful
          content:
            application/json:
              schema: 
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        default:
          $ref: '#/components/responses/Unexpected'
          
  /health_readiness:
    get:
      tags:
      - general
      summary: Return a 200 status if health check is successful
      operationId: main.src.controllers.v1.general.get_health_readiness
      security: []
      responses:
        200:
          description: Readiness Health check is successful
          content:
            application/json:
              schema: 
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        default:
          $ref: '#/components/responses/Unexpected'

  /create_test_data:
    get:
      tags:
      - general
      summary: create test data in database
      operationId: main.src.controllers.v1.general.create_test_data
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /get_stats:
    get:
      tags:
      - general
      summary: get stats in database
      operationId: main.src.controllers.v1.general.get_stats
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /update_user_profile:
    patch:
      tags:
      - account
      summary: update user profile
      operationId: main.src.controllers.v1.account.update_user_profile
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
                user_name:
                  type: string
                  maxLength: 16
                referrer:
                  type: string
                  maxLength: 8
                  nullable: true
              required:
                - uid
                - user_name
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
          
  /create_user:
    post:
      tags:
      - account
      summary: create user profile
      operationId: main.src.controllers.v1.account.create_user
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                referrer:
                  type: string
                  maxLength: 8
                  nullable: True
              required:
                - uid
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'
          
  /delete_user:
    delete:
      tags:
      - account
      summary: create user profile
      operationId: main.src.controllers.v1.account.delete_user
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
              required:
                - uid
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'

  /get_user_profile:
    get:
      tags:
      - account
      summary: get user profile
      operationId: main.src.controllers.v1.account.get_user_profile
      parameters:
        - in: query
          name: uid
          schema:
            type: string
            maxLength: 28
            minLength: 28
          description: user ID
          required: true
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Unexpected'
  
  /get_executing_status:
    get:
      tags:
      - bot
      summary: get bot executing status. Check if unexpected error and dangling threads
      operationId: main.src.controllers.v1.bot.get_executing_status
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'
  
  /execute_bot_signal:
    post:
      tags:
      - bot
      summary: recieve signal info and make orders
      operationId: main.src.controllers.v1.bot.execute_bot_signal
      security:
        - bearerAuthBackendOnly: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /execute_webhook_signal/{bot_id}:
    post:
      tags:
      - bot
      summary: recieve webhook signal info and make orders
      operationId: main.src.controllers.v1.bot.execute_webhook_signal
      security: []
      parameters:
        - in: path
          name: bot_id
          required: true
          schema:
            type: number
          description: bot ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 28
                  minLength: 28
                symbol:
                  type: string
                  maxLength: 8
                action:
                  $ref: '#/components/schemas/Action'
              required:
              - symbol
              - action
              - token
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /get_user_bots:
    get:
      tags:
      - bot
      summary: get user running bot
      operationId: main.src.controllers.v1.bot.get_user_bots
      parameters:
        - in: query
          name: uid
          schema:
            type: string
            maxLength: 28
            minLength: 28
          description: user ID
          required: true
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bot_id:
                      type: integer
                    config:
                      $ref: '#/components/schemas/BotConfig'
                    channel:
                      $ref: '#/components/schemas/Channel'
                    status:
                      $ref: '#/components/schemas/BotStatus'
                  required:
                  - channel
                  - status
                  - config
                  - bot_id
        default:
          $ref: '#/components/responses/Unexpected'

  /get_bot_trades:
    get:
      tags:
      - bot
      summary: get bot trade history
      operationId: main.src.controllers.v1.bot.get_bot_trades
      parameters:
        - in: query
          name: bot_id
          schema:
            type: integer
          description: bot ID
          required: true
        - in: query
          name: uid
          schema:
            type: string
            maxLength: 28
            minLength: 28
          description: user ID
          required: true
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
        default:
          $ref: '#/components/responses/Unexpected'
          
  /create_user_bot:
    post:
      tags:
      - bot
      summary: create new bot. 5 for each user.
      operationId: main.src.controllers.v1.bot.create_user_bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
                config:
                  $ref: '#/components/schemas/BotConfig'
                channel:
                  $ref: '#/components/schemas/Channel'
              required:
              - uid
              - config
              - channel
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'

  /update_user_bot:
    patch:
      tags:
      - bot
      summary: update bot
      operationId: main.src.controllers.v1.bot.update_user_bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
                config:
                  $ref: '#/components/schemas/BotConfig'
                status:
                  $ref: '#/components/schemas/BotStatus'
                  nullable: true
                bot_id:
                  type: integer
              required:
              - uid
              - config
              - bot_id
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'

  /delete_user_bot:
    delete:
      tags:
      - bot
      summary: delete bot
      operationId: main.src.controllers.v1.bot.delete_user_bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
                bot_id:
                  type: integer
              required:
              - uid
              - bot_id
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
  
  /create_user_api:
