                    minimum: 0
                    maximum: 2000
                  trades:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trade'
                required:
                - page
                - pagesize
                - total_page
                - trades
                - total_count
        default:
          $ref: '#/components/responses/Unexpected'
          
  /create_user_bot:
    post:
