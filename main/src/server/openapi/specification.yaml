components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: main.src.core.auth.openapi_auth

    bearerAuthBackendOnly:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: main.src.core.auth.openapi_auth_backend_only

  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unexpected:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
        code:
          type: integer
          minimum: 100
          maximum: 600

    ExtendedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required:
          - rootCause
          properties:
            rootCause:
              type: string

    Page:
      type: integer
      minimum: 0
      maximum: 100
      default: 0

    PageSize:
      type: integer
      minimum: 10
      maximum: 100
      default: 20

    TotalPage:
      type: integer
      minimum: 0
      maximum: 200
    
    Notify:
      type: object
      properties:
        TG:
          type: object
        EMAIL:
          type: object
        SMS:
          type: object

    ReferralHistory:
      type: object
      properties:
        timestamp:
          type: number
          minimum: 0
        referral_code:
          type: string
          maxLength: 8
          minLength: 8
        bot_id:
          type: integer
          minimum: 0
          nullable: True
        subscription_id:
          type: integer
          minimum: 0
          nullable: True
        rebate:
          type: number
          minimum: 0
      required:
        - referral_code
        - bot_id
        - subscription_id
        - rebate
        - timestamp

    Referral:
      type: object
      properties:
        referrer_code:
          type: string
          maxLength: 8
          minLength: 8
          readOnly: true
          nullable: true
        referral_code:
          type: string
          maxLength: 8
          minLength: 8
          readOnly: true
        register_count:
          type: integer
          minimum: 0
          readOnly: true
        bot_count:
          type: integer
          minimum: 0
          readOnly: true
        subscribe_count:
          type: integer
          minimum: 0
          readOnly: true
        total_rebate:
          type: number
          minimum: 0
          default: 0
          readOnly: true
        rebate_rate:
          type: number
          minimum: 0
          default: 0.1
          readOnly: true
        referrer_rebate_rate:
          type: number
          minimum: 0
          default: 0.1
        referral_rebate_rate:
          type: number
          minimum: 0
          default: 0.0
      required:
        - referrer_code
        - referral_code
        - register_count
        - bot_count
        - subscribe_count
        - total_rebate
        - rebate_rate
        - referrer_rebate_rate
        - referral_rebate_rate

    Action:
      type: string
      nullable: true
      maxLength: 16
      enum:
        - BUY
        - SELL
        - null
        - buy
        - sell

    BotStatus:
      type: string
      enum:
        - PENDING
        - RUNNING
        - SUSPEND
        - STOPPED

    Channel:
      type: string
      maxLength: 16
      enum:
        - ROSE
        - PERPETUAL
        - WHALE
        - DAILYSCALP
        - VEGAS
        - JUSTIN
        - WEBHOOK
        - COURAGE
        - MOON
        - ARBITRAGE
        - AIRFORCE7
