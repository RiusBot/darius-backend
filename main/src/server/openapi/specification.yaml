openapi: 3.0.1
info:
  title: darius-backend
  version: 1.0.0
servers:
  - url: /api/v1
tags:
  - name: fee
  - name: bot
  - name: general
  - name: log
  - name: api
  - name: pair
  - name: account
  - name: plan
  - name: performance
  - name: hyperopt
  - name: subscription
  - name: transaction
  - name: telegram
  - name: trade
  - name: referral
  - name: notify
security:
  - bearerAuth: []
paths:
  /health_liveness:
    get:
      tags:
      - general
      summary: Return a 200 status if health check is successful
      operationId: main.src.controllers.v1.general.get_health_liveness
      security: []
      responses:
        200:
          description: Liveness Health check is successful
          content:
            application/json:
              schema: 
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        default:
          $ref: '#/components/responses/Unexpected'
          
  /health_readiness:
    get:
      tags:
      - general
      summary: Return a 200 status if health check is successful
      operationId: main.src.controllers.v1.general.get_health_readiness
      security: []
      responses:
        200:
          description: Readiness Health check is successful
          content:
            application/json:
              schema: 
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
        default:
          $ref: '#/components/responses/Unexpected'

  /roilog:
    post:
      tags:
      - log
      summary: log roi from providers
      operationId: main.src.controllers.v1.log.roilog
      security: []
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  maxLength: 16
                access_token:
                  type: string
                  maxLength: 32
                roi:
                  type: number
                timestamp:
                  type: number
                  minimum: 0
              required:
                - provider
                - access_token
                - roi
                - timestamp
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Unexpected'

  /rebatelog:
    post:
      tags:
      - log
      summary: log rebate from exchange
      operationId: main.src.controllers.v1.log.rebatelog
      security:
        - bearerAuthBackendOnly: []
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
        default:
          $ref: '#/components/responses/Unexpected'

  /create_test_data:
    get:
      tags:
      - general
      summary: create test data in database
      operationId: main.src.controllers.v1.general.create_test_data
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /get_stats:
    get:
      tags:
      - general
      summary: get stats in database
      operationId: main.src.controllers.v1.general.get_stats
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'
          
  /clean_no_subscription_bot:
    delete:
      tags:
      - general
      summary: delete no subscription bot
      operationId: main.src.controllers.v1.general.clean_no_subscription_bot
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /update_user_profile:
    patch:
      tags:
      - account
      summary: update user profile
      operationId: main.src.controllers.v1.account.update_user_profile
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
                user_name:
                  type: string
                  maxLength: 16
              required:
                - uid
                - user_name
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'
          
  /create_user:
    post:
      tags:
      - account
      summary: create user profile
      operationId: main.src.controllers.v1.account.create_user
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                referrer:
                  type: string
                  maxLength: 8
                  nullable: True
              required:
                - uid
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
        default:
          $ref: '#/components/responses/Unexpected'
          
  /delete_user:
    delete:
      tags:
      - account
      summary: create user profile
      operationId: main.src.controllers.v1.account.delete_user
      requestBody:
        required: True
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
              required:
                - uid
      responses:
        '200':
          description: success
        default:
          $ref: '#/components/responses/Unexpected'

  /get_user_profile:
    get:
      tags:
      - account
      summary: get user profile
      operationId: main.src.controllers.v1.account.get_user_profile
      parameters:
        - in: query
          name: uid
          schema:
            type: string
            maxLength: 28
            minLength: 28
          description: user ID
          required: true
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/Unexpected'
  
  /execute_bot_signal:
    post:
      tags:
      - bot
      summary: recieve signal info and make orders
      operationId: main.src.controllers.v1.bot.execute_bot_signal
      security:
        - bearerAuthBackendOnly: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /execute_webhook_signal/{bot_id}:
    post:
      tags:
      - bot
      summary: recieve webhook signal info and make orders
      operationId: main.src.controllers.v1.bot.execute_webhook_signal
      security: []
      parameters:
        - in: path
          name: bot_id
          required: true
          schema:
            type: number
          description: bot ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  maxLength: 28
                  minLength: 28
                symbol:
                  type: string
                  maxLength: 8
                price:
                  type: number
                  minimum: 0
                amount:
                  type: number
                  minimum: 0
                position:
                  type: number
                stop_loss:
                  type: number
                  minimum: 0
                take_profit:
                  type: number
                  minimum: 0
                action:
                  $ref: '#/components/schemas/Action'
              required:
              - symbol
              - action
              - token
      responses:
        '200':
          description: received
        default:
          $ref: '#/components/responses/Unexpected'

  /get_user_bots:
    get:
      tags:
      - bot
      summary: get user running bot
      operationId: main.src.controllers.v1.bot.get_user_bots
      parameters:
        - in: query
          name: uid
          schema:
            type: string
            maxLength: 28
            minLength: 28
          description: user ID
          required: true
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bot_id:
                      type: integer
                    config:
                      $ref: '#/components/schemas/BotConfig'
                    channel:
                      $ref: '#/components/schemas/Channel'
                    status:
                      $ref: '#/components/schemas/BotStatus'
                  required:
                  - channel
                  - status
                  - config
                  - bot_id
        default:
          $ref: '#/components/responses/Unexpected'
          
  /get_user_history_bots:
    get:
      tags:
      - bot
      summary: get user closed bot
      operationId: main.src.controllers.v1.bot.get_user_history_bots
      parameters:
        - in: query
          name: uid
          schema:
            type: string
            maxLength: 28
            minLength: 28
          description: user ID
          required: true
        - in: query
          name: page
          schema:
            $ref: '#/components/schemas/Page'
          description: page number
        - in: query
          name: pagesize
          schema:
            $ref: '#/components/schemas/PageSize'
          description: page size
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  page:
                    $ref: '#/components/schemas/Page'
                  pagesize:
                    $ref: '#/components/schemas/PageSize'
                  total_page:
                    $ref: '#/components/schemas/TotalPage'
                  total_count:
                    type: integer
                    minimum: 0
                    maximum: 2000
                  bots:
                    type: array
                    items:
                      type: object
                      properties:
                        bot_id:
                          type: integer
                        config:
                          $ref: '#/components/schemas/BotConfig'
                        channel:
                          $ref: '#/components/schemas/Channel'
                        status:
                          $ref: '#/components/schemas/BotStatus'
                      required:
                      - channel
                      - status
                      - config
                      - bot_id
                required:
                  - page
                  - pagesize
                  - total_page
                  - bots
                  - total_count
        default:
          $ref: '#/components/responses/Unexpected'

  /get_bot_trades:
    get:
      tags:
      - trade
      summary: get bot trade history
      operationId: main.src.controllers.v1.trade.get_bot_trades
      parameters:
