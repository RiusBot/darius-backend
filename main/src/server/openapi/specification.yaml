          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                  maxLength: 28
                  minLength: 28
                config:
                  $ref: '#/components/schemas/BotConfig'
                status:
                  $ref: '#/components/schemas/BotStatus'
                  nullable: true
                bot_id:
                  type: integer
              required:
              - uid
              - config
